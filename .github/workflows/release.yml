name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
            dotnet-version: 10.0.x
            include-prerelease: true

      - name: Build and Package Self-Contained Binaries
        shell: pwsh
        run: |
          .\scripts\build-windows.ps1 -Configuration Release -SelfContained -PackageZip
          .\scripts\build-windows.ps1 -Configuration Release_Portable -SelfContained -PackageZip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/XTR-Unlocker-Setup.exe
            dist/XTR-Unlocker-Release-win-x64.zip
            dist/XTR-Unlocker-Release_Portable-win-x64.zip
          generate_release_notes: true
          draft: false
          prerelease: false
