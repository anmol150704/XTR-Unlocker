name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: microsoft/setup-msbuild@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build XTR and bundle OptiScaler
        shell: pwsh
        run: .\scripts\build-windows.ps1 -Configuration Release
      - name: Upload Windows app build
        uses: actions/upload-artifact@v4
        with:
          name: xtr-unlocker-windows-x64
          path: desktop/src/bin/x64/Release/net10.0-windows10.0.26100.0/win-x64/
          if-no-files-found: error
          retention-days: 14
