name: Native runtime build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 45
    if: hashFiles('runtime/OptiScaler/OptiScaler.sln') != ''
    steps:
      - uses: actions/checkout@v4
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Apply XTR in-game overlay
        working-directory: runtime/OptiScaler
        run: git apply ../../runtime/patches/xtr-overlay-branding.patch

      - name: Build pinned OptiScaler source
        run: msbuild "runtime/OptiScaler/OptiScaler.sln" /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal